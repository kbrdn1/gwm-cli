# gwm preset: symfony
#
# Opinionated .gwm.toml for a Symfony app:
#   - copies `.env.local` (guarded against AWS RDS hosts) and `.env.test.local`
#   - refuses to inherit the `vendor/` and `var/` symlinks
#   - runs `composer install` + `direnv allow` after the worktree is created
#
# Symfony's dotenv convention is the mirror image of Laravel's: `.env` is
# committed and holds the neutral defaults, while `.env.local` is gitignored
# and holds the machine-local secrets. So git already puts `.env` in the new
# worktree and only the local override needs copying, and `.env` is exactly
# the right `example_file` for the guard to seed from when the copy points at
# a production RDS host.
#
# `var/` is listed alongside `vendor/` because it holds the compiled service
# container and the cached routes: sharing it between two worktrees running
# different code is worse than a slow first request.
#
# Preview with `gwm init --preset symfony --show`; write with
# `gwm init --preset symfony`. See examples/gwm.toml.example for the full
# schema and every available knob.

[worktree]
base = "{home}/cc-worktree/{repo}"
path_pattern = "{type}-{issue}-{desc}"
branch_pattern = "{type}/#{issue}-{desc}"

[[bootstrap.copy]]
from = ".env.local"
to = ".env.local"
required = false
guards = ["no-aws-rds"]

[[bootstrap.copy]]
from = ".env.test.local"
to = ".env.test.local"
required = false

[[bootstrap.guard]]
name = "no-aws-rds"
deny_patterns = ["amazonaws\\.com", "\\.rds\\."]
on_match = "seed-from-example"
example_file = ".env"

[[bootstrap.no_symlink]]
path = "vendor"

[[bootstrap.no_symlink]]
path = "var"

[[hooks.post_create]]
name = "composer install"
run = "composer install --no-interaction --prefer-dist"
when = "file_exists:composer.json"
on_fail = "warn"

[[hooks.post_create]]
name = "direnv allow"
run = "direnv allow ."
when = "file_exists:.envrc"
on_fail = "ignore"
